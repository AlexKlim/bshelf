default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + 2 %>

development:
  <<: *default
  database: bshelf_development

test:
  <<: *default
  database: bshelf_test

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
