production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  enrich_missing_books:
    class: EnrichMissingBooksJob
    schedule: every 15 minutes
  read_cover_colors:
    class: ReadCoverColorsJob
    schedule: every 15 minutes
  prune_catalog_entries:
    command: "CatalogEntry.prune"
    schedule: every day at 3:30am
  remote_browser_dispatch:
    command: "RemoteBrowserSession.dispatch!"
    schedule: every minute
  health_check:
    class: HealthCheckJob
    schedule: every hour at minute 5
