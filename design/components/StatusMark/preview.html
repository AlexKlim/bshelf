<!-- @dsCard group="Основа" height=170 subtitle="Четыре статуса и форматы, RU и EN" -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>StatusMark</title>
<style>
  body { margin: 0; padding: 16px; background: var(--paper); font-family: var(--font-ui); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 24px; }
</style>
</head>
<body>
<div class="grid">
  <span class="bs-status"><i class="bs-ico bs-ico-want" aria-hidden="true"></i>Хочу · с мая 2025</span>
  <span class="bs-status"><i class="bs-ico bs-ico-want" aria-hidden="true"></i>Want · since May 2025</span>
  <span class="bs-status"><i class="bs-ico bs-ico-owned" aria-hidden="true"></i>На полке · куплено в июне 2026</span>
  <span class="bs-status"><i class="bs-ico bs-ico-owned" aria-hidden="true"></i>Owned · bought Jun 2026</span>
  <span class="bs-status bs-status--strong"><i class="bs-ico bs-ico-progress" aria-hidden="true"></i>Слушаю · с октября 2026</span>
  <span class="bs-status bs-status--strong"><i class="bs-ico bs-ico-progress" aria-hidden="true"></i>Reading · since Oct 2026</span>
  <span class="bs-status"><span class="bs-status__formats"><i class="bs-ico bs-ico-audio" aria-hidden="true"></i></span>Прослушал · март 2024</span>
  <span class="bs-status"><span class="bs-status__formats"><i class="bs-ico bs-ico-audio" aria-hidden="true"></i><i class="bs-ico bs-ico-ebook" aria-hidden="true"></i></span>Read and listened · 2023, 2024</span>
</div>
</body>
</html>
