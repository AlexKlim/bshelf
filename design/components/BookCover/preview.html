<!-- @dsCard group="Книга" height=380 subtitle="Закрытая книга: шаг «достать» между корешком и разворотом" -->
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>BookCover</title>
<style>
  body { margin: 0; padding: 32px 24px; background: var(--wall); font-family: var(--font-ui); }
  .row { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; }
</style>
</head>
<body>
<div class="row">
  <div class="bs-closed bs-cloth--ochre" role="img" aria-label="Пикник на обочине, Аркадий и Борис Стругацкие. Аудио и книга">
    <div class="bs-closed__label">
      <span class="bs-closed__author">Стругацкие</span>
      <span class="bs-closed__title">Пикник на обочине</span>
    </div>
    <span class="bs-closed__format"><i class="bs-ico bs-ico-audio" aria-hidden="true"></i><i class="bs-ico bs-ico-ebook" aria-hidden="true"></i></span>
  </div>
  <div class="bs-closed bs-cloth--navy" role="img" aria-label="Project Hail Mary, Andy Weir. E-book">
    <div class="bs-closed__label">
      <span class="bs-closed__author">Andy Weir</span>
      <span class="bs-closed__title">Project Hail Mary</span>
    </div>
    <span class="bs-closed__format"><i class="bs-ico bs-ico-ebook" aria-hidden="true"></i></span>
  </div>
  <div class="bs-closed bs-cloth--oxblood" role="img" aria-label="Мастер и Маргарита, Михаил Булгаков. Аудио">
    <div class="bs-closed__label">
      <span class="bs-closed__author">Михаил Булгаков</span>
      <span class="bs-closed__title">Мастер и Маргарита</span>
    </div>
    <span class="bs-closed__format"><i class="bs-ico bs-ico-audio" aria-hidden="true"></i></span>
  </div>
</div>
</body>
</html>
